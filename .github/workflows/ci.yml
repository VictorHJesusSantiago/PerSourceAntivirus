name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore PerSourceAntivirus.slnx

      - name: Build (compiler warnings as errors)
        run: >
          dotnet build PerSourceAntivirus.slnx --no-restore -c Release -warnaserror
          -warnnotaserror:NU1507,NU1603,NU1608,NU1701,NU1900,NU1901,NU1902,NU1903,NU1904,MSB3246

      - name: Test
        run: >
          dotnet test PerSourceAntivirus.slnx --no-build -c Release
          --settings psav.runsettings
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

  security-scan:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PerSourceAntivirus.slnx

      - name: Check for vulnerable dependencies
        shell: pwsh
        run: |
          $output = dotnet list PerSourceAntivirus.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output
          if ($output -match '\bHigh\b|\bCritical\b') {
            Write-Error "Dependencies with High/Critical vulnerabilities found."
            exit 1
          }
          Write-Host "No High/Critical dependency vulnerabilities."

      - name: Check for deprecated dependencies
        shell: pwsh
        continue-on-error: true
        run: dotnet list PerSourceAntivirus.slnx package --deprecated

  codeql:
    runs-on: windows-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Build for analysis
        run: dotnet build PerSourceAntivirus.slnx -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
